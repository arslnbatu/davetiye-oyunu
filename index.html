<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Merve & Batuhan — Davetiye</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f9c8d4;
      --surface: #f0b4c2;
      --gold: #7a0019;
      --gold-light: #a0002a;
      --gold-dim: #9a1030;
      --cream: #7a0019;
      --text: #6a0015;
      --muted: #b06070;
      --card-back: #7a0019;
      --card-border: #5a0012;
      --matched: #5a0012;
      --matched-border: #3a000b;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* ── Header ── */
    header { text-align: center; width: 100%; }

    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(24px, 6vw, 42px);
      font-weight: 300;
      color: var(--cream);
      line-height: 1.2;
    }

    header h1 em {
      font-style: italic;
      color: var(--gold-light);
    }

    .subtitle {
      margin-top: 8px;
      font-size: clamp(11px, 3vw, 13px);
      color: var(--muted);
      font-weight: 300;
    }

    /* ── Ornament ── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--gold-dim);
      font-size: 16px;
      width: 100%;
      justify-content: center;
    }
    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      max-width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim));
    }
    .ornament::after { transform: scaleX(-1); }

    /* ── Stats ── */
    .stats {
      display: flex;
      gap: 0;
      text-align: center;
      width: 100%;
      max-width: 320px;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
    }

    .stat-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 12px 8px;
    }

    .stat-item + .stat-item {
      border-left: 1px solid var(--card-border);
    }

    .stat-value {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 300;
      color: var(--gold-light);
      line-height: 1;
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    @media (max-width: 380px) {
      .card-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    }

    /* ── Card ── */
    .card {
      aspect-ratio: 3/4;
      perspective: 600px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .card-back {
      background: var(--card-back);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s;
    }

    .card:active:not(.matched) .card-back { border-color: var(--gold-dim); }

    @media (hover: hover) {
      .card:hover:not(.matched) .card-back { border-color: var(--gold-dim); }
    }

    .card-back-pattern {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back-pattern img {
      width: 72%;
      height: 72%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .card-front {
      transform: rotateY(180deg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card.matched .card-front {
      border-color: var(--matched-border);
      box-shadow: 0 0 16px rgba(122,0,25,0.4);
    }
    .card.matched .card-back { background: var(--matched); }

    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      25%      { transform: rotateY(180deg) translateX(-5px); }
      75%      { transform: rotateY(180deg) translateX(5px); }
    }
    .card.wrong .card-inner { animation: shake 0.35s ease; }

    /* ── Win Banner ── */
    .win-banner {
      text-align: center;
      padding: 8px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.5s ease 0.3s;
      pointer-events: none;
    }
    .win-banner.show { opacity: 1; transform: translateY(0); }
    .win-banner p {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ══════════════════════════════
       POPUP
    ══════════════════════════════ */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .popup-overlay.active { opacity: 1; pointer-events: all; }

    /* Kaydırılabilir sarmalayıcı — tüm yüksekliği kaplar */
    .popup-scroll {
      width: 100%;
      max-width: 560px;
      max-height: 94svh;
      max-height: 94vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .popup-overlay.active .popup-scroll { transform: translateY(0); }

    .popup {
      background: var(--surface);
      border: 1px solid var(--gold-dim);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      width: 100%;
      padding: 20px 18px 40px;
      text-align: center;
      box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    /* Tablet ve üstünde ortalanmış modal */
    @media (min-width: 600px) {
      .popup-overlay { align-items: center; }
      .popup-scroll {
        max-height: 90svh;
        max-height: 90vh;
        border-radius: 16px;
        transform: translateY(20px) scale(0.97);
      }
      .popup-overlay.active .popup-scroll { transform: translateY(0) scale(1); }
      .popup {
        border-bottom: 1px solid var(--gold-dim);
        border-radius: 16px;
        padding: 32px 32px 36px;
      }
    }

    /* Drag handle — sadece mobilde */
    .popup-handle {
      width: 36px; height: 4px;
      background: var(--card-border);
      border-radius: 2px;
      margin: 0 auto 16px;
      flex-shrink: 0;
    }
    @media (min-width: 600px) { .popup-handle { display: none; } }

    .popup-badge {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .popup h2 {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(20px, 5.5vw, 32px);
      font-weight: 300;
      color: var(--cream);
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .popup-divider {
      width: 50px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      margin: 12px auto;
    }

    .popup-invite-text {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(13px, 3.8vw, 15px);
      font-style: italic;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2px;
    }

    .popup-event-details {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 12px 0;
      background: rgba(122,0,25,0.08);
      border: 1px solid rgba(122,0,25,0.2);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: clamp(12px, 3.4vw, 14px);
      color: var(--text);
      flex-wrap: wrap;
      line-height: 1.4;
    }
    .detail-row .icon { font-size: 14px; flex-shrink: 0; }
    .detail-row strong { color: var(--cream); }

    .invite-image-wrap {
      width: 100%;
      margin-bottom: 16px;
    }
    .invite-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      object-fit: contain;
    }

    .popup-question {
      font-size: clamp(12px, 3.4vw, 13px);
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── İsim Formu ── */
    .name-form { margin: 0 0 14px; }

    .name-fields { display: flex; gap: 8px; }

    .field-wrap {
      flex: 1; min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }
    .field-wrap label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .field-wrap input {
      background: rgba(122,0,25,0.06);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 11px 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px; /* 16px = iOS zoom yok */
      color: var(--cream);
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      -webkit-appearance: none;
    }
    .field-wrap input::placeholder { color: var(--muted); font-size: 13px; }
    .field-wrap input:focus { border-color: var(--gold-dim); }
    .field-wrap input.error { border-color: #7a0019; }

    .name-error {
      font-size: 11px; color: #7a0019;
      margin-top: 6px; display: none; text-align: left;
    }
    .name-error.show { display: block; }

    /* ── Butonlar ── */
    .popup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 13px 10px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: clamp(10px, 2.8vw, 12px);
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .btn-yes   { background: #7a0019; color: #f9c8d4; }
    .btn-no    { background: transparent; color: var(--muted); border: 1px solid var(--card-border); }
    .btn-maybe { background: transparent; color: var(--gold-dim); border: 1px solid rgba(122,0,25,0.3); }

    .btn-yes:active   { background: #a0002a; }
    .btn-no:active    { border-color: var(--muted); color: var(--text); }
    .btn-maybe:active { border-color: var(--gold-dim); color: var(--gold); }

    @media (hover: hover) {
      .btn-yes:hover   { background: #a0002a; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(122,0,25,0.3); }
      .btn-no:hover    { border-color: var(--muted); color: var(--text); transform: translateY(-2px); }
      .btn-maybe:hover { border-color: var(--gold-dim); color: var(--gold); transform: translateY(-2px); }
    }

    /* ── Onay ekranı ── */
    .popup-confirm { display: none; flex-direction: column; align-items: center; gap: 12px; }
    .popup-confirm.show { display: flex; }
    .popup-main.hidden  { display: none; }

    .confirm-icon  { font-size: 40px; }
    .confirm-title {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 300; color: var(--cream);
    }
    .confirm-sub { font-size: clamp(12px, 3vw, 13px); color: var(--muted); }

    .btn-close {
      margin-top: 4px;
      padding: 10px 24px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-close:active { border-color: var(--gold-dim); color: var(--text); }
    @media (hover: hover) {
      .btn-close:hover { border-color: var(--gold-dim); color: var(--text); }
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <header>
    <p class="eyebrow">Seni Aramıza Bekliyoruz</p>
    <h1>Kartları Eşleştir,<br><em>Daveti Keşfet</em></h1>
    <p class="subtitle">Özel çifti bul ve sürprizi açığa çıkar</p>
  </header>

  <div class="ornament">✦</div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-value" id="attempts">0</div>
      <div class="stat-label">Deneme</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="matched-count">0</div>
      <div class="stat-label">Eşleşen</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="remaining">4</div>
      <div class="stat-label">Kalan</div>
    </div>
  </div>

  <div class="card-grid" id="card-grid"></div>

  <div class="win-banner" id="win-banner">
    <p>✦ Tüm kartlar eşleşti ✦</p>
  </div>

</div>

<!-- ══════════════ POPUP ══════════════ -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup-scroll">
  <div class="popup">
    <div class="popup-handle"></div>

    <!-- Ana davetiye -->
    <div class="popup-main" id="popup-main">
      <div class="invite-image-wrap">
        <img src="20.png" alt="Davetiye" class="invite-img" />
      </div>

      <p class="popup-question">Bu özel günümüzde bize eşlik edecek misiniz?</p>

      <div class="name-form">
        <div class="name-fields">
          <div class="field-wrap">
            <label for="input-name">Ad</label>
            <input type="text" id="input-name" placeholder="Adınız" autocomplete="given-name" />
          </div>
          <div class="field-wrap">
            <label for="input-surname">Soyad</label>
            <input type="text" id="input-surname" placeholder="Soyadınız" autocomplete="family-name" />
          </div>
        </div>
        <p class="name-error" id="name-error">Lütfen adınızı ve soyadınızı girin.</p>
      </div>

      <div class="popup-actions">
        <button class="btn btn-yes"   onclick="respond('Evet, geleceğim! 🎉')">Evet, Geleceğim</button>
        <button class="btn btn-no"    onclick="respond('Maalesef gelemeyeceğim 😢')">Katılamıyorum</button>
      </div>
    </div>

    <!-- Onay mesajı -->
    <div class="popup-confirm" id="popup-confirm">
      <div class="confirm-icon"  id="confirm-icon" style="display:none"></div>
      <div class="confirm-title" id="confirm-title">Teşekkürler!</div>
      <div class="confirm-sub"   id="confirm-sub">Cevabınız alındı.</div>
      <button class="btn-close" onclick="closePopup()">Kapat</button>
    </div>
  </div>
  </div>
</div>

<script>
  // ══════════════════════════════════════════
  // GÖRSEL AYARLARI
  // Her çiftte iki FARKLI görsel kullanılır:
  //   special çifti → 1.jpg + 2.jpg  ← davetiyeyi açar
  //   b çifti       → 3.jpg + 4.jpg
  //   c çifti       → 5.jpg + 6.jpg
  //   d çifti       → 7.jpg + 8.jpg
  // ══════════════════════════════════════════
  const CARD_PAIRS = [
    { id: 'special', label: '💍', src1: '1.jpg', src2: '2.jpg' },
    { id: 'b',       label: '🌸', src1: '3.jpg', src2: '4.jpg' },
    { id: 'c',       label: '🕯️', src1: '5.jpg', src2: '6.jpg' },
    { id: 'd',       label: '🥂', src1: '7.jpg', src2: '8.jpg' },
  ];

  // ══════════════════════════════════════════
  // APPS SCRIPT URL
  // ══════════════════════════════════════════
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzm9PkCG2e1SMwRbWnfUHr2KvVShOdU3AB6xol0pEU-tm41NWvwEmT2Le6mSvpRDi_d/exec';

  // ══════════════════════════════════════════
  // OYUN MOTORU
  // ══════════════════════════════════════════
  let cards = [], flipped = [], matchedCount = 0, attempts = 0, locked = false;

  function buildDeck() {
    const deck = [];
    CARD_PAIRS.forEach(p => {
      deck.push({ id: p.id, label: p.label, src: p.src1, uid: p.id + '_1' });
      deck.push({ id: p.id, label: p.label, src: p.src2, uid: p.id + '_2' });
    });
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  }

  function renderGrid() {
    const grid = document.getElementById('card-grid');
    grid.innerHTML = '';
    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="card-back-pattern"><img src="10.png" alt="" draggable="false" /></div>
          </div>
          <div class="card-face card-front">
            <img src="${card.src}" alt="" loading="lazy" />
          </div>
        </div>`;
      el.addEventListener('click', () => flipCard(el, card));
      grid.appendChild(el);
    });
    updateStats();
  }

  function flipCard(el, card) {
    if (locked || el.classList.contains('flipped') || el.classList.contains('matched') || flipped.length >= 2) return;
    el.classList.add('flipped');
    flipped.push({ el, card });
    if (flipped.length === 2) { locked = true; attempts++; updateStats(); checkMatch(); }
  }

  function checkMatch() {
    const [a, b] = flipped;
    if (a.card.id === b.card.id) {
      setTimeout(() => {
        a.el.classList.replace('flipped', 'matched');
        b.el.classList.replace('flipped', 'matched');
        matchedCount++; updateStats();
        flipped = []; locked = false;
        if (a.card.id === 'special') setTimeout(openPopup, 500);
        if (matchedCount === CARD_PAIRS.length) document.getElementById('win-banner').classList.add('show');
      }, 400);
    } else {
      a.el.classList.add('wrong');
      b.el.classList.add('wrong');
      setTimeout(() => {
        a.el.classList.remove('flipped', 'wrong');
        b.el.classList.remove('flipped', 'wrong');
        flipped = []; locked = false;
      }, 900);
    }
  }

  function updateStats() {
    document.getElementById('attempts').textContent     = attempts;
    document.getElementById('matched-count').textContent = matchedCount;
    document.getElementById('remaining').textContent    = CARD_PAIRS.length - matchedCount;
  }

  // ══════════════════════════════════════════
  // POPUP
  // ══════════════════════════════════════════
  function openPopup() {
    document.getElementById('popup-main').classList.remove('hidden');
    document.getElementById('popup-confirm').classList.remove('show');
    document.getElementById('input-name').value = '';
    document.getElementById('input-surname').value = '';
    document.getElementById('name-error').classList.remove('show');
    document.getElementById('popup-overlay').classList.add('active');
  }

  function closePopup() {
    document.getElementById('popup-overlay').classList.remove('active');
  }

  function respond(answer) {
    const nameEl    = document.getElementById('input-name');
    const surnameEl = document.getElementById('input-surname');
    const errorEl   = document.getElementById('name-error');
    const name      = nameEl.value.trim();
    const surname   = surnameEl.value.trim();

    if (!name || !surname) {
      errorEl.classList.add('show');
      if (!name)    nameEl.classList.add('error');
      if (!surname) surnameEl.classList.add('error');
      [nameEl, surnameEl].forEach(el =>
        el.addEventListener('input', () => { el.classList.remove('error'); errorEl.classList.remove('show'); }, { once: true })
      );
      return;
    }

    document.getElementById('confirm-title').textContent = 'Teşekkürler!';
    document.getElementById('confirm-sub').textContent   = `${name} ${surname} — cevabınız kaydedildi.`;
    document.getElementById('popup-main').classList.add('hidden');
    document.getElementById('popup-confirm').classList.add('show');

    saveResponse(answer, name, surname);
  }

  async function saveResponse(answer, name, surname) {
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ time: new Date().toLocaleString('tr-TR'), name, surname, answer })
      });
    } catch(e) { console.error('Kayıt hatası:', e); }
  }

  document.getElementById('popup-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closePopup();
  });

  cards = buildDeck();
  renderGrid();
</script>
</body>
</html>
